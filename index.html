<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lance Mon Job</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg:#0f0f12; --fg:#f4f4f5; --muted:#a1a1aa; --accent:#8b5cf6; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      padding:24px; line-height:1.6;
    }
    .card { max-width:520px; text-align:center; }
    .logo { font-size:28px; font-weight:800; margin-bottom:24px; }
    .logo span { color:var(--accent); }
    h1 { font-size:22px; margin:0 0 12px; }
    p { color:var(--muted); margin:0 0 16px; font-size:16px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .foot { margin-top:28px; font-size:13px; color:#71717a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">✦ Lance Mon <span>Job</span></div>
    <h1>Le site est en cours de refonte</h1>
    <p>Lance Mon Job revient bientôt, avec une nouvelle version. Le service n'accepte pas de nouvelle commande pour le moment.</p>
    <p>Une question&nbsp;? Écrivez-nous à <a href="mailto:contact@lancemonjob.fr">contact@lancemonjob.fr</a>.</p>
    <div class="foot">© Lance Mon Job — Données traitées conformément au RGPD.</div>
  </main>
</body>
</html>
